  docs: https://api-docs.solarize.energy/api-compatibility
  notes: >-
    The Solarize API is unversioned. Breaking changes are announced by email to
    all API key holders 4 weeks in advance, with a detailed migration guide.
    Breaking changes include: altered resource URLs; removed/renamed response
    properties or request parameters; deleted enum values; an optional parameter
    becoming required; and changed HTTP status codes. Additive changes
    (new resources, parameters, properties, enum values) ship without notice.
