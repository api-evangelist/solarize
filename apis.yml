aid: solarize
name: Solarize
description: >-
  Solarize is a German energy software company offering a meter-to-cash
  billing platform as a software-as-a-service for utilities, municipal
  utilities (Stadtwerke), and energy providers. The platform converts metering
  data into a revenue stream through automated billing and invoicing, metering
  data management, monitoring and reporting, and flexible electricity-product
  configuration. Solarize exposes a REST API at api.solarize.energy covering
  customers, sites, meters, contracts, measurements, readings, invoices,
  payments, pricing, and outgoing webhooks, enabling open-architecture
  integration with ERP, CRM, and metering-operator systems.
