tags:
  - Rate Limiting
  - Energy Billing
description: >-
  The Solarize API enforces a single global rate limit of 600 calls per minute
  per client, measured over a rolling 1-minute window. Exceeding the limit
  results in rate limiting applied to subsequent requests. No per-tier or
  per-endpoint limits are published.
limits:
  - name: All API calls
    scope: client
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
    window: rolling
